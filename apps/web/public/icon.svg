<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A2744"/>
      <stop offset="100%" stop-color="#0D1628"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#E8956A"/>
      <stop offset="100%" stop-color="#B9684B"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#B9684B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#B9684B" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <!-- Subtle border -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="white" stroke-opacity="0.1" stroke-width="1.5"/>
  <!-- Glow blob behind bars -->
  <ellipse cx="32" cy="40" rx="22" ry="14" fill="url(#glowGrad)"/>

  <!-- Waveform bars — 5 bars, centered, varying heights -->
  <g filter="url(#glow)">
    <!-- Bar 1 -->
    <rect x="13" y="34" width="5" height="14" rx="2.5" fill="white" fill-opacity="0.25"/>
    <!-- Bar 2 -->
    <rect x="21" y="26" width="5" height="22" rx="2.5" fill="white" fill-opacity="0.45"/>
    <!-- Bar 3 — tallest, terracotta accent -->
    <rect x="29" y="18" width="6" height="30" rx="3" fill="url(#barGrad)"/>
    <!-- Bar 4 -->
    <rect x="38" y="24" width="5" height="24" rx="2.5" fill="white" fill-opacity="0.45"/>
    <!-- Bar 5 -->
    <rect x="46" y="32" width="5" height="16" rx="2.5" fill="white" fill-opacity="0.25"/>
  </g>

  <!-- Subtle top highlight -->
  <rect x="16" y="1" width="32" height="1.5" rx="0.75" fill="white" fill-opacity="0.12"/>
</svg>
